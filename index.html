<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Card Dealer Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 16px 28px}
h1{font-size:27px;margin:8px 0 4px}.sub{color:#6b7280;margin-bottom:20px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
button{border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer}
.tab{background:#e5e7eb}.tab.active{background:#111827;color:white}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
label{display:block;font-weight:700;font-size:14px;margin:0 0 7px}
input,select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:11px;font-size:18px;margin-bottom:15px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{background:#eef2ff}.rate.selected{background:#111827;color:white}
.result{background:#111827;color:white;border-radius:15px;padding:17px;text-align:center;margin-top:8px}
.result .big{font-size:31px;font-weight:800;margin-top:4px}
.row{display:flex;justify-content:space-between;margin:9px 0}.positive{font-weight:800}.muted{color:#6b7280}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<h1>Card Dealer Calculator</h1>
<div class="sub">Fast buying & trading decisions at shows</div>

<div class="tabs">
<button class="tab active" onclick="showTab('buy',this)">BUY</button>
<button class="tab" onclick="showTab('trade',this)">TRADE</button>
<button class="tab" onclick="showTab('profit',this)">PROFIT</button>
</div>

<section id="buy" class="card">
<label>Market Value</label>
<input id="buyValue" type="number" inputmode="decimal" placeholder="100" oninput="calcBuy()">
<label>Buy Rate</label>
<div class="rates">
<button class="rate" onclick="setRate(.70,this)">70%</button>
<button class="rate" onclick="setRate(.75,this)">75%</button>
<button class="rate selected" onclick="setRate(.80,this)">80%</button>
<button class="rate" onclick="setRate(.85,this)">85%</button>
<button class="rate" onclick="setRate(.90,this)">90%</button>
<button class="rate" onclick="setRate(.95,this)">95%</button>
</div>
<div class="result"><div>MAX CASH BUY</div><div class="big" id="buyResult">$0.00</div></div>
</section>

<section id="trade" class="card hidden">
<label>Value of Cards Customer Gives You</label>
<input id="tradeIn" type="number" inputmode="decimal" placeholder="100" oninput="calcTrade()">
<label>Value You Give Customer</label>
<input id="tradeOut" type="number" inputmode="decimal" placeholder="125" oninput="calcTrade()">
<div class="result"><div>TRADE DIFFERENCE</div><div class="big" id="tradeResult">$0.00</div><div id="tradeText">Enter both values</div></div>
</section>

<section id="profit" class="card hidden">
<label>Expected Sale Price</label>
<input id="sale" type="number" inputmode="decimal" placeholder="150" oninput="calcProfit()">
<label>Your Cost</label>
<input id="cost" type="number" inputmode="decimal" placeholder="100" oninput="calcProfit()">
<label>Fees / Other Costs</label>
<input id="fees" type="number" inputmode="decimal" placeholder="0" oninput="calcProfit()">
<div class="result">
<div>ESTIMATED PROFIT</div><div class="big" id="profitResult">$0.00</div>
<div id="marginText">Margin: 0%</div>
</div>
</section>
</div>

<script>
let rate=.80;
const money=n=>'$'+(Number(n)||0).toFixed(2);
function showTab(id,btn){
 document.querySelectorAll('.card').forEach(x=>x.classList.add('hidden'));
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.remove('hidden');btn.classList.add('active');
}
function setRate(r,btn){
 rate=r;document.querySelectorAll('.rate').forEach(x=>x.classList.remove('selected'));
 btn.classList.add('selected');calcBuy();
}
function calcBuy(){
 const v=Number(document.getElementById('buyValue').value)||0;
 document.getElementById('buyResult').textContent=money(v*rate);
}
function calcTrade(){
 const a=Number(document.getElementById('tradeIn').value)||0;
 const b=Number(document.getElementById('tradeOut').value)||0;
 const d=a-b;
 document.getElementById('tradeResult').textContent=money(Math.abs(d));
 document.getElementById('tradeText').textContent=!a&&!b?'Enter both values':d>=0?'You receive equal or more value':'You give more value than you receive';
}
function calcProfit(){
 const s=Number(document.getElementById('sale').value)||0,c=Number(document.getElementById('cost').value)||0,f=Number(document.getElementById('fees').value)||0;
 const p=s-c-f, m=s?p/s*100:0;
 document.getElementById('profitResult').textContent=money(p);
 document.getElementById('marginText').textContent='Margin: '+m.toFixed(1)+'%';
}
</script>
</body>
</html>
